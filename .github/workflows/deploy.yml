name: CI

# Runs on pushes AND pull requests. The previous version ran on pushes to main
# only, so a PR could never be checked before merge — by the time it ran, the
# content was already live via Cloudflare Pages.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  content-drift:
    name: Content SSOT drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The stage table used to be maintained by hand in diagnostic.html and
      # playbook.html. 5 of 20 shared fields had silently drifted apart before
      # this check existed. This fails the build if a GENERATED region no longer
      # matches content/practices.json — either because the region was
      # hand-edited, or because the source changed without regenerating.
      - name: Verify generated HTML matches content/practices.json
        run: node tools/render_content.mjs --check

      # The radar's maths is separated from the DOM so it can be checked with
      # no browser. Each assertion was driven over a known-bad mutation of the
      # module before being trusted — a wrong angle, or a blank answer plotted
      # at the centre, both render happily and lie.
      - name: Radar geometry checks
        run: node tools/test_radar.cjs

      # dimension_read.js is shared by BOTH practices, so a silent change here
      # changes the Agile diagnostic and the BA team-health page at once. Band
      # boundaries and the weakest-axis tie-break are pinned rather than assumed.
      - name: Shared dimension-read checks
        run: node tools/test_dimension_read.cjs

      # radar_image parses a payload that arrives from a public form, so its
      # validator is an input boundary. Needs backend deps for the rasteriser.
      - name: Readiness radar image checks
        run: npm ci --prefix backend && node tools/test_radar_image.mjs
