name: CI

# Runs on pushes AND pull requests. The previous version ran on pushes to main
# only, so a PR could never be checked before merge — by the time it ran, the
# content was already live via Cloudflare Pages.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  content-drift:
    name: Content SSOT drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The stage table used to be maintained by hand in diagnostic.html and
      # playbook.html. 5 of 20 shared fields had silently drifted apart before
      # this check existed. This fails the build if a GENERATED region no longer
      # matches content/practices.json — either because the region was
      # hand-edited, or because the source changed without regenerating.
      - name: Verify generated HTML matches content/practices.json
        run: node tools/render_content.mjs --check

      # The share cards were the one artifact in this pipeline with no guard,
      # and they drifted: ai-readiness.png advertised a twelve-question, six-area
      # instrument for the whole life of a sixteen-question, eight-area one. A
      # card is the one place text is pixels, so no other check could see it.
      # This compares assets/og/manifest.json against content/pages.json rather
      # than re-rendering — see tools/test_og_cards.cjs for why byte comparison
      # is the wrong guard here.
      - name: Share cards match the content SSOT
        run: node tools/test_og_cards.cjs

      # One sentence was serving four pages: index, playbook and services held
      # byte-identical descriptions and diagnostic held the same sentence with
      # two clauses swapped, which an exact-match census reports as unique.
      # Three others were longer than the card can draw and shipped with an
      # ellipsis nobody chose.
      - name: Page metadata is distinct and fits the card
        run: node tools/test_page_meta.cjs

      # The radar's maths is separated from the DOM so it can be checked with
      # no browser. Each assertion was driven over a known-bad mutation of the
      # module before being trusted — a wrong angle, or a blank answer plotted
      # at the centre, both render happily and lie.
      - name: Radar geometry checks
        run: node tools/test_radar.cjs

      # dimension_read.js is shared by BOTH practices, so a silent change here
      # changes the Agile diagnostic and the BA team-health page at once. Band
      # boundaries and the weakest-axis tie-break are pinned rather than assumed.
      - name: Shared dimension-read checks
        run: node tools/test_dimension_read.cjs

      # An interactive element nested inside a pointer-events: none container
      # is visible, focusable and dead to touch. The mobile menu button was
      # exactly that on every page, in production, with every other check green.
      - name: Hit-target checks
        run: node tools/test_hit_targets.cjs

      # Counts asserted in PROSE cannot be seen by the drift check above: it
      # compares generated regions against the source, so a hand-written
      # heading sitting outside the markers, or a wrong number inside the
      # source's own copy, both pass it. Two such claims were live on main when
      # this check was added, and this check is what found them.
      - name: Content count claims match the SSOT
        run: node tools/test_content_counts.cjs

      # radar_image parses a payload that arrives from a public form, so its
      # validator is an input boundary. Needs backend deps for the rasteriser.
      - name: Readiness radar image checks
        run: npm ci --prefix backend && node tools/test_radar_image.mjs

      # The email breakdown reads the same payload, and its whole job is a
      # distinction the prose summary collapses: 1/1 and 5/5 both have zero gap
      # and are the two most opposite readings the scale can produce.
      #
      # This step also carries the escape/polygon coupling. radar_geometry
      # drops the ENTIRE polygon when any axis is absent, which is correct only
      # while no question offers a way to decline. That precondition is not
      # visible from either file alone, so it is asserted here rather than left
      # as a comment two modules apart.
      - name: Readiness email checks
        run: node tools/test_readiness_email.mjs
